# ============================================================
#  Утренний дайджест вакансий — настройки
#  Агент перечитывает этот файл при каждом запуске и сам его не меняет.
#  Пароли и логины сюда НЕ пишем — они в secrets.env
# ============================================================

# --- Кого ищем -------------------------------------------------
profile:
  # Отбор по названию — как запросы hh.ru: NAME:(include…) AND NOT NAME:(exclude…).
  # Вакансия подходит, если подходит хотя бы под один запрос. Смотрим только должность до « — »
  # (на jabka после тире идёт описание). include — целым словом («аналитик» не ловит «для аналитики»),
  # exclude — по началу слова («системный» ловит «системного»). Дефис делит слова: «BI-Аналитик» проходит.
  title_queries:
    - include: ["аналитический", "аналитик", "analyst", "дата аналитик", "дата-аналитик",
                "аналитик данных", "data analyst", "data-аналитик"]
      exclude: ["преподаватель", "автор курса", "руководитель", "тимлид", "hr", "бизнес", "business", "журналист", "маркетинг", "marketing", "системный",
                "system", "1с", "1c", "web", "маркетплейс", "wildberries", "битрикс", "писатель", "junior",
                "младший", "intern", "trainee", "кредитный", "таможенный", "инвестиционный", "маркетолог",
                "ученик", "фот", "стажер", "стажёр", "практикант", "бухгалтер", "ассистент", "финансовый",
                "dwh", "экономист", "асутп"]
    - include: ["продуктовый аналитик", "аналитик продукта", "продакт-аналитик", "продакт аналитик",
                "product analyst", "product analytics"]
      exclude: ["преподаватель", "автор курса", "руководитель", "тимлид", "hr", "бизнес", "business", "журналист", "маркетинг", "marketing", "системный",
                "system", "1с", "1c", "web", "маркетплейс", "wildberries", "битрикс", "писатель", "junior",
                "младший", "intern", "trainee", "кредитный", "таможенный", "инвестиционный", "маркетолог",
                "ученик", "фот", "стажер", "стажёр", "практикант", "бухгалтер", "ассистент", "финансовый",
                "dwh", "дизайнер", "soc", "экономист"]
  # Роли — запасной отбор, только если title_queries выше убрать
  target_roles:
    - product_analyst      # продуктовый аналитик
    - data_analyst         # аналитик данных / data analyst
  # Грейды, которые отсекаем
  exclude_grades: ["intern", "junior"]
  # Слова в должности, после которых вакансию сразу выкидываем
  exclude_title_words: ["стажер", "стажёр", "intern", "trainee", "1с-аналитик", "аналитик 1с"]
  # Кратко о себе — уходит в промпт LLM
  about: >
    Продуктовый аналитик, ~5 лет опыта (финтех, B2B-площадка, банк).
    Стек: SQL, Python, ClickHouse, PostgreSQL, Power BI, Grafana. Живу в России (Череповец),
    рассматриваю только удалённую работу, которую можно выполнять из России.

# --- Источники ---------------------------------------------------
sources:
  telegram:
    lookback_days_first_run: 5   # при самом первом запуске — посты за N дней (5 — чтобы захватить с 16.10)
    max_pages_per_run: 5         # сколько страниц по ~20 постов можно пролистать назад
    expand_digests: true         # разворачивать посты-подборки в отдельные вакансии
    max_digest_fetches: 30       # сколько постов из подборок можно открыть за запуск
    channels:
      - {name: nodatanojobs,          enabled: true}
      - {name: careerstation_analyst, enabled: true}
      - {name: codeworkshopru,        enabled: true}
      # Мало аналитиков в выборке ~20 постов, но держать почти бесплатно.
      # Через месяц смотрим статистику в письмах и решаем.
      - {name: HR_CATExpert,          enabled: true}
      - {name: talentmove_channel,    enabled: true}
      # Карьерный канал МТС Банка (с 20.10): подборки — ссылки-названия или цитаты «вакансия + Откликнуться»
      - {name: mtsbankcareer,         enabled: true}
      # с 22.10: каналы junior/стажировок (youngjunior.ru) — грейд берётся из заголовков подборок
      - {name: young_june,            enabled: true}
      - {name: newdirections,         enabled: true}
      # с 22.10: подборки «из бигтеха» с разделами Стажёр/Junior/Middle; источник большинства карточек jabka.work
      - {name: bigtechjobs,           enabled: true}
      # с 22.10: ~7 постов в день, вакансии разных уровней (Lead / Senior Analyst) + утренние junior-подборки
      - {name: myresume_ru,           enabled: true}
      - {name: FreeWorkFeed,          enabled: true}
      - {name: wntdan,                enabled: true}
      - {name: workayte,              enabled: true}   # добавлен 25.11 по списку пользователя; с Windows ещё не проверен
      - {name: yuniorapp,             enabled: true}   # добавлен 25.11 по списку пользователя; похоже на junior — отсев по грейду

  sites:
    - name: jabka
      enabled: true
      lookback_days_first_run: 5
      max_pages: 20           # ~20 карточек в сутки: 20 страниц хватит и после новогодних каникул
      urls:
        - "https://jabka.work/?search=%D0%90%D0%BD%D0%B0%D0%BB%D0%B8%D1%82%D0%B8%D0%BA&workMode=REMOTE"
        # Попробовать вместо широкого «Аналитик» — раздел «Продукт → Аналитика»:
        # - "https://jabka.work/product-management?cluster=product-analytics&workMode=REMOTE"

    # с 22.10: сайт «junior и без опыта», но карточки без метки грейда бывают middle (Циан, опыт от 3 лет);
    # метка junior/intern и «стажировка» → отсев, «в офис» → отсев
    - name: youngjunior
      enabled: true
      lookback_days_first_run: 5
      max_pages: 10
      urls:
        - "https://youngjunior.ru/product-analyst/jobs"
        - "https://youngjunior.ru/data-analyst/jobs"

    # с 16.11: все карьерные сайты проверяются утром и в 17:00.
    - name: habr
      enabled: true
      morning_only: false
      lookback_days_first_run: 5
      max_pages: 20
      urls:
        - "https://career.habr.com/vacancies?q=аналитик&type=all&sort=date"
        - "https://career.habr.com/vacancies?q=analyst&type=all&sort=date"

    - name: avito
      enabled: true
      morning_only: false
      lookback_days_first_run: 5
      max_pages: 10
      urls:
        - "https://career.avito.com/vacancies/analitika-dannykh/"

    - name: aviasales
      enabled: true
      morning_only: false
      lookback_days_first_run: 5
      max_pages: 1
      urls:
        - "https://www.aviasales.ru/about/vacancies"

    - name: vk
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 5
      urls:
        - "https://team.vk.company/career/api/v2/vacancies/?title=аналитик&limit=25&offset=0"
        - "https://team.vk.company/career/api/v2/vacancies/?title=analyst&limit=25&offset=0"

    - name: mts
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 5
      urls:
        - "https://job.mts.ru/api/v2/catalog/v1/vacancies?q=аналитик&limit=25&offset=0"
        - "https://job.mts.ru/api/v2/catalog/v1/vacancies?q=analyst&limit=25&offset=0"

    # с 16.11: дополнительные карьерные сайты; только подтверждённая удалёнка.
    - name: megafon
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 10
      urls:
        - "https://job.megafon.ru/vacancy/all/any?q=аналитик"
        - "https://job.megafon.ru/vacancy/all/any?q=analyst"
        - "https://job.megafon.ru/vacancy/all/any?q=BI"

    - name: sber
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 10
      urls:
        - "https://rabota.sber.ru/public/app-candidate-public-api-gateway/api/v1/publications?skip=0&take=100&searchString=аналитик&schedules=4"
        - "https://rabota.sber.ru/public/app-candidate-public-api-gateway/api/v1/publications?skip=0&take=100&searchString=analyst&schedules=4"

    - name: twogis
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 10
      urls:
        - "https://job.2gis.ru/api/v1/vacancies?page=1&isRemote=true"

    - name: magnit
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 20
      urls:
        - "https://magnit.tech/api/v1/vacancy?page=1"

    - name: tbank
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 30
      urls:
        # Адаптер переводит параметры поиска в читающий POST публичного API.
        - "https://www.tbank.ru/pfpjobs/papi/getVacancies?searchQuery=аналитик&offset=0&limit=25"
        - "https://www.tbank.ru/pfpjobs/papi/getVacancies?searchQuery=analyst&offset=0&limit=25"

    - name: alfabank
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 10
      urls:
        - "https://job.alfabank.ru/api/vacancies?text=аналитик&skip=0&take=100"
        - "https://job.alfabank.ru/api/vacancies?text=analyst&skip=0&take=100"

    - name: tochka
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 3
      urls:
        # Каталог «Удалённо» по IT; остальные страницы подгружаются кнопкой, 6 вакансий помещаются на первую.
        - "https://hr.tochka.com/vacancies/it/remote-work/"

    - name: ostrovok
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 3
      urls:
        - "https://career.ostrovok.ru/vacancy"

    # getmatch: открытый API, специализации Product Analytics и Data Analytics & BI;
    # удалёнка — структурированный формат remote для России или «весь мир».
    - name: getmatch
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 10
      urls:
        - "https://getmatch.ru/api/offers?sp=product_analyst&sp=data_analyst_bi&pa=all&offset=0&limit=50"

    # GeekJob: JSON-поиск сайта с фильтром «удалённо» (rm=1), 100 карточек на страницу.
    - name: geekjob
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 5
      urls:
        - "https://geekjob.ru/json/find/vacancy?page=1&qs=аналитик&rm=1"
        - "https://geekjob.ru/json/find/vacancy?page=1&qs=analyst&rm=1"

    # СДЭК: открытый API поиска (q), страницы по 10; удалёнка — метка «Удалённо» в выдаче.
    - name: cdek
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 5
      urls:
        - "https://rabota.cdek.ru/api/vacancies?q=аналитик&offset=0&limit=10"
        - "https://rabota.cdek.ru/api/vacancies?q=analyst&offset=0&limit=10"

    # Домклик: весь каталог через открытый API (~20 вакансий); удалёнка — REMOTE в work_format.
    - name: domclick
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 5
      urls:
        - "https://career.domclick.ru/api/v1/vacancy/?offset=0&limit=100"

    # Компании на Huntflow (одна страница со всеми вакансиями); формат работы только текстом.
    - name: huntflow
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 1
      urls:
        - "https://banki.huntflow.io/"

    # X5 (вся группа: X5 Tech, Digital, Пятёрочка, Перекрёсток…): открытый API; удалёнка — work_format=remote.
    - name: x5
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 10
      urls:
        - "https://rabota.x5.ru/vacancy/api/v1/public/vacancies?search=аналитик&page=1&page_size=50"
        - "https://rabota.x5.ru/vacancy/api/v1/public/vacancies?search=analyst&page=1&page_size=50"

    # Подключены 26.11 «в засаду»: ждём появления удалённых аналитиков, даже если сейчас их нет.
    # Контур: каталог направления «Аналитика»; удалёнка — JobPosting jobLocationType=TELECOMMUTE.
    - name: kontur
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 1
      urls:
        - "https://kontur.ru/career/vacancies?direction=analytics"

    # Яндекс: открытый API публикаций (курсорные страницы); удалёнка — work_modes «remote».
    - name: yandex
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 10
      urls:
        - "https://yandex.ru/jobs/api/publications/?text=аналитик&page_size=20"
        - "https://yandex.ru/jobs/api/publications/?text=analyst&page_size=20"

    # Selectel: серверный каталог всех вакансий; формат работы — только текстом (общий разбор).
    - name: selectel
      enabled: true
      morning_only: false
      lookback_days_first_run: 14
      max_pages: 1
      urls:
        - "https://selectel.ru/careers/all/"

  linkedin_posts:
    enabled: true   # проверено в Chrome и dry-run на копии SQLite 19.11
    start_date: "2026-11-20"
    autostart: true
    lookback_days_first_run: 7
    max_posts_per_tag: 20   # потолок в коде — 20 (vd/linkedin_browser.py)
    max_scrolls_per_tag: 2
    # Посты выбранных рекрутеров: у человека «Все действия», у компании «Публикации».
    # Список с именами — локальный файл (data/ не в git); бюджет отдельный от хэштегов.
    recruiters_file: "data/linkedin-recruiters.yaml"
    max_posts_per_recruiter: 5
    recruiter_timeout_sec: 25
    recruiters_timeout_sec: 420
    request_timeout_sec: 125
    total_timeout_sec: 1000
    total_timeout_by_date:
      "2026-11-23": 1200  # разовый обход всех 14 тегов в понедельник; затем снова 360 с
    # Поиск по хэштегам выключен 26.11 по решению пользователя: за 10 выпусков (20–26.11) ~1600 постов,
    # 0 вакансий в письме (англоязычные / русские теги пустые), 15–17 минут на выпуск. Читаются только рекрутеры.
    # Включить обратно — вернуть список вместо [].
    # 26.11: вместо них — русские запросы (проверены в браузере: свежие русские посты HR с вакансиями аналитиков,
    # 1–3 в неделю на запрос). Поле hashtags принимает и фразы до 6 слов.
    # 27.11: поиск без фильтра LinkedIn по дате (с ним русские запросы давали 0 постов); сортировка «сначала
    # новые», дата проверяется до копирования ссылки, стоп на первом посте старше search_days.
    search_days: 30
    hashtags:
      - "#vacancy аналитик"
      - "вакансия продуктовый аналитик"
      - "вакансия аналитик данных"
      - "#vacancy #ProductAnalytics аналитик"
    #  - "#hiring"
    #  - "#ProductAnalyst"
    #  - "#AnalyticsJobs"
    #  - "#DataAnalyst"
    #  - "#ProductAnalytics"
    #  - "#BIAnalyst"
    #  - "#продуктовыйаналитик"
    #  - "#аналитикданных"
    #  - "#vacancy"
    #  - "#hr"
    #  - "#jobs"
    #  - "#вакансия"
    #  - "#работа"
    #  - "#карьера"
  linkedin_mail:
    # Включить после недели проверки, что уведомления LinkedIn приходят на почту
    enabled: false
    lookback_days_first_run: 2
    from_filter: "linkedin.com"

# --- Почта -------------------------------------------------------
mail:
  provider: yandex         # gmail | yandex  (логин и пароль приложения — в secrets.env)
  to: ""                   # пусто = отправлять на тот же ящик, что EMAIL_USER
  subject_prefix: "Вакансии"
  send_when_empty: true    # присылать письмо «новых нет», чтобы было видно, что агент жив

# --- Отметки «Откликнулся» (Google Форма) -------------------------
# Под каждой вакансией — ссылка: один клик записывает её код в таблицу ответов формы.
# Каждый запуск читает таблицу (открыта по ссылке на просмотр) и больше не присылает эти вакансии.
marks:
  enabled: true
  form_url: "https://docs.google.com/forms/d/e/1FAIpQLSdJXUL_hnpacyizfb6LJg2kcS0FYcO2R91_IxvSw1buF2RXbQ/formResponse"
  form_field: "entry.536851866"
  sheet_csv_url: "https://docs.google.com/spreadsheets/d/1HTjh3T_puwcSS91bsVyPKHC3CwnrRiLAhiAJN0YTadM/export?format=csv"

# --- Локальная LLM (LM Studio) ----------------------------------
llm:
  enabled: false   # 20.10: пока без модели — LM Studio не поднимается без окна; включим, когда наладим автозапуск
  base_url: "http://localhost:1234/v1"
  model: "qwen2.5-14b-instruct-1m"   # идентификатор модели из LM Studio (вкладка Developer)
  autostart_server: true          # если сервер не отвечает — запустить «lms server start»
  timeout_sec: 180
  max_chars_per_item: 3500        # длинные посты обрезаем
  prompt_suffix: ""               # для Qwen3 можно поставить "/no_think"

# --- Прочее ------------------------------------------------------
run:
  once_per_slot: true       # два выпуска в день — утро и вечер; каждый не чаще раза (кроме --force)
  evening_hour: 17          # с этого часа (МСК, время компьютера) — вечерний выпуск
  workdays_only: true       # письма только в рабочие дни производственного календаря РФ (isdayoff.ru, кэш в data/)
  dedup_days: 30            # окно консервативных совпадений и смысловых пометок
  permanent_confirmed_dedup: true  # исходный ID/URL вакансии или точная публикация — без срока
  http_timeout_sec: 25
