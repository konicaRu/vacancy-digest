<html><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"vacancies": [{"id": 3486, "approved": true, "actual": true, "externalId": 4364018, "position": "Senior Pricing Analyst", "tasks": "<ul><li>Развитие аналитики B2C прайсинга, формирование четких подходов по балансу выручки, конверсии, маржинальности </li><li>Обеспечение оценки влияния решений на метрики и экономику </li><li>Разработка инструментов для мониторинга и анализ результатов ценовых A/B тестов. </li><li>Исследование и усовершенствование методологий проведения и анализа A/B экспериментов, улучшение существующих методологий компании. </li><li>Внедрение и адаптация ML-алгоритмов для улучшения процессов ценообразования. </li><li>Изучение поведения пользователей в продукте и формулирование гипотез для новых функций алгоритмов ценообразования. </li><li>Управление небольшой командой, занимающейся прайсинговой продуктовой аналитикой</li></ul>", "requirements": "<ul><li>Опыт работы в продуктовой или ценовой аналитике не менее 3.5 лет</li><li>Отличное владение методами математической статистики (доверительные интервалы, t-тест, u-тест).</li><li>Уверенное владение инструментами анализа данных на Python (pandas, numpy, scipy, matplotlib/plotly).</li><li>Опыт построения и оптимизации ETL-процессов (ETL pipelines)</li><li>Владение инструментами распределённой обработки данных PySpark</li><li>Знание методов Causal inference для выявления причинно-следственных связей</li><li>Знание и применение методов трансформации данных, таких как Bootstrap, CUPED, линеаризация.</li><li>Навыки написания эффективных SQL-запросов.</li><li>Владение английским языком не ниже B1</li></ul>", "conditions": "<ul><li>Полная свобода для достижения результатов: гибкий график, дистанционный (с территории Российской Федерации или Республики Беларусь) или офис — ты сам решаешь, где и когда работать*</li><li>ДМС с первого месяца работы и скидки в сервисе «Ясно», а также дополнительный оплачиваемый выходной день MyTime Day Off.</li><li>Внутренние программы адаптации и обучения, развития soft skills и лидерских навыков.</li><li>Корпоративные скидки на занятия в Skyeng.</li><li>Корпоративные цены на отели и другие услуги для путешествий.</li><li>Аккредитованная IT-компания.</li></ul><p>*<em>Мы оформляем сотрудников в одну из компаний группы, и это зависит от того, где ты работаешь: из России — в российское юрлицо, из Беларуси — в белорусское. Поэтому работать у нас можно только из России или Беларуси.</em></p>", "accountDivision": 52703, "division": {"id": 93, "externalId": 52703, "name": "Marketing Department", "foreign": "Marketing Department", "order": 24, "active": true, "parent": null, "deep": 0, "meta": null, "teams": [1], "updatedAt": "2026-11-18T04:00:02.587Z", "createdAt": "2026-03-10T15:31:10.807Z"}, "state": "OPEN", "hidden": false, "location": null, "updatedAt": "2026-11-18T04:00:11.273Z", "createdAt": "2026-11-10T04:00:09.663Z", "teamLabel": "Marketing"}, {"id": 3484, "approved": true, "actual": true, "externalId": 4264002, "position": "Senior Product Analyst (B2C Hotels) ", "tasks": "<ul><li><p><strong>Сопровождение продуктовых изменений:</strong></p><ul><li>Активное участие на всех этапах АБ-экспериментов: формирование и оценка гипотез, описание дизайна эксперимента, подведение итогов и формирование рекомендаций по дальнейшему развитию инициативы;</li><li>Генерация гипотез для роста;</li><li>Поиск и челлендж новых гипотез вместе с продуктовой командой для улучшения опыта пользователя и метрик продукта.</li></ul></li><li><p><strong>Построение и актуализация продуктовых дашбордов</strong>:</p><ul><li>Создание и поддержание аналитических дашбордов для мониторинга здоровья продукта и ключевых метрик бизнеса. P&amp;L отелей;</li><li>Содействие продуктовой команде в построении и управлении P&amp;L отелей, анализ влияния различных рычагов на конверсию продукта, участие в планировании.</li></ul></li><li><p><strong>Взаимодействие с командой продукта</strong>.</p><ul><li>Пло ": "Business Analytics", "order": 31, "active": true, "parent": null, "deep": 0, "meta": null, "teams": [4], "updatedAt": "2026-11-18T04:00:02.956Z", "createdAt": "2026-03-10T15:31:10.945Z"}, "state": "OPEN", "hidden": false, "location": null, "updatedAt": "2026-11-18T04:00:11.773Z", "createdAt": "2026-11-06T04:00:12.873Z", "teamLabel": "Ostrovok!Tech"}, {"id": 3481, "approved": true, "actual": true, "externalId": 4350753, "position": "Middle+ DWH Engineer", "tasks": "<ul><li>Разработка DWH и витрин данных; </li><li>Оптимизация ETL пайплайнов; </li><li>Коммуникация с бизнес-аналитиками и формализация задач; </li><li>Участие в улучшении архитектуры аналитического хранилища и моделирование данных; </li><li>Описание предметной области бизнеса и дизайн логической модели; </li><li>Настройка транспортов данных из внешних источников.</li></ul>", "requirements": "<ul><li>Уверенное знание SQL и опыт оптимизации запросов;</li><li>Опыт работы с MPP СУБД (Vertica/Clickhouse/Greenplum) от 1 года</li><li>Опыт с DBT, Trino, GIT, AirFlow</li><li>Знания в области архитектуры хранилищ данных (нормальные формы, схема Звезда, Data Vault).</li><li>Опыт работы с AI</li></ul>", "conditions": "<ul><li>Полная свобода для достижения результатов: гибкий график, удалёнка или офис — ты сам решаешь, где и когда работать.&nbsp;</li><li>ДМС с первого месяца работы и скидки в сервисе «Ясно», а также дополнительный оплачиваемый выходной день MyTime Day Off.</li><li>Внутренние программы адаптации и обучения, развития soft skills и лидерских навыков.</li><li>Корпоративные скидки на занятия в Skyeng.</li><li>Корпоративные цены на отели и другие услуги для путешествий.</li><li>Аккредитованная IT-компания.</li></ul>", "accountDivision": 52702, "division": {"id": 97, "externalId": 52702, "name": "Engineering Department", "foreign": "Engineering Department", "order": 28, "active": true, "parent": 315625, "deep": 1, "meta": null, "teams": [4], "updatedAt": "2026-11-18T04:00:02.794Z", "createdAt": "2026-03-10T15:31:10.896Z"}, "state": "OPEN", "hidden": false, "location": null, "updatedAt": "2026-11-18T04:00:10.723Z", "createdAt": "2026-10-19T13:53:00.521Z", "teamLabel": "Ostrovok!Tech"}, {"id": 3478, "approved": true, "actual": true, "externalId": 4345158, "position": "Middle+ Product Manager for Air", "tasks": "<ul><li>Вести продуктовую разработку: самостоятельно проводить дискавери, организовывать технические дискавери, планировать и контролировать деливери проекта.</li><li>Работать с пост-лаунч метриками: анализировать результаты после релиза, выявлять зоны роста и инициировать изменения для повышения эффективности продукта.</li><li>Отвечать за весь цикл развития продукта: формулировать стратегию, цели проекта, строить и актуализировать продуктовый роадмап, приоритизировать задачи по применимым фреймворкам (impact/effort и др.).</li><li>Организовывать и координировать работу на кросс-командных проектах, взаимодействовать с бизнес-заказчиками и лидерами других команд.</li><li>Прогнозировать и проактивно коммуницировать риски.</li><li>Проводить продуктовые исследования, формулировать и проверять гипотезы, принимать решения на основании данных, защищать дизайн-решения.</li></ul>", "requirements": "<ul><li>Опыт управления крупными комплексными веб-продуктами: от формирования стратегии и бизнес-логики до запуска и развития от 3 лет</li><li>Опыт ведения кросскомандных/межфункциональных проектов, плотная работа с бизнес-заказчиками</li><li>Сильные навыки анализа и работы с данными: метрики, юнит-экономика, знание SQL и BI-инструментов </li><li>Понимание технической части, опыт глубокого погружения в бизнес-логику продукта</li><li>Владение инструментами планирования и приоритизации</li><li>Опыт проведения продуктового/технического дискавери, построения исследовательских гипотез, проверки их на данных</li><li>Английский не ниже B2</li></ul>", "conditions": "<ul><li>Полная свобода для достижения результатов: гибкий график, удалёнка или офис — ты сам решаешь, где и когда работать.&nbsp;</li><li>ДМС с первого месяца работы и скидки в сервисе «Ясно», а также дополнительный оплачиваемый выходной день MyTime Day Off.</li><li>Внутренние программы адаптации и обучения, развития soft skills и лидерских навыков.</li><li>Корпоративные скидки на занятия в Skyeng.</li><li>Корпоративные цены на отели и другие услуги для путешествий.</li><li>Аккредитованная IT-компания.</li></ul>", "accountDivision": 52704, "division": {"id": 98, "externalId": 52704, "name": "Product & Projects Department", "foreign": "Product & Projects Department", "order": 29, "active": true, "parent": 315625, "deep": 1, "meta": null, "teams": [4], "updatedAt": "2026-11-18T04:00:02.849Z", "createdAt": "2026-03-10T15:31:10.912Z"}, "state": "OPEN", "hidden": false, "location": null, "updatedAt": "2026-11-18T04:00:10.876Z", "createdAt": "2026-10-09T04:00:11.555Z", "teamLabel": "Ostrovok!Tech"}, {"id": 3473, "approved": true, "actual": true, "externalId": 4345160, "position": "Product Analyst (Content)", "tasks": "<p><strong>Обязанности</strong></p><ul><li>Исследовать поведение пользователей и искать точки роста продукта на данных: например, как фото, описания, доступность номеров влияют на конверсию и бронирования;</li><li>Оценивать потенциальный эффект продуктовых инициатив и готовить рекомендации, которые помогают команде решить, что делать в первую очередь;</li><li>Участвовать в A/B-тестах на всех этапах: помогать с дизайном, считать результаты, формулировать выводы. Там, где тест невозможен, оценивать эффект методами causal inference;</li><li>Следить за «здоровьем» продуктовых метрик: строить дашборды, настраивать алерты, разбираться в причинах аномалий;</li><li>Оформлять исследования в отчёты, понятные менеджменту, и делиться находками с командой;</li><li>Автоматизировать регулярную отчётность и выгрузки, чтобы команды могли сами отвечать на типовые вопросы без участия аналитика.</li></ul>", "requirements": "<ul><li><p><strong>Требования</strong></p><ul><li>Опыт от 1 года в продуктовом анализе;</li><li>SQL: джойны, агрегации, подзапросы и CTE, оконные функции;</li><li>Python для анализа данных: pandas, numpy, визуализация (matplotlib, seaborn или plotly), статистические тесты (scipy, statsmodels);</li><li>Знание теории вероятностей и математической статистики: проверка гипотез, p-value, доверительные интервалы, ошибки I и II рода;</li><li>Понимание, как устроен A/B-тест и как интерпретировать его результаты;</li><li>Умение собрать простой ETL-процесс для внутреннего запроса команды;</li><li>Опыт использования AI-инструментов в анализе: генерация гипотез, ревью кода, EDA. При этом результат проверяется самостоятельно, и есть понимание, когда на AI полагаться нельзя;</li><li>Умение структурно излагать мысли: сначала главный вывод, затем аргументы.</li></ul><p><strong>Будет плюсом</strong></p><ul><li>Опыт дизайна A/B-тестов, знакомство с CUPED;</li><li>Знакомство с causal inference или ML;</li><li>Tableau или другая BI-система;</li><li>Опыт в e-commerce, маркетплейсах или travel;</li><li>Профильное образование (математика, статистика, прикладная математика и информатика, экономика) в ведущих вузах: ВШЭ, МФТИ, МГУ, СПбГУ и других.</li></ul></li></ul>", "conditions": "<ul><li>Интересные проекты: создаём продукты для путешественников, тревел-агентов и отельеров по всему миру.&nbsp;</li><li>Полная свобода для достижения результатов: гибкий график, удалёнка или офис — ты сам решаешь, где и когда работать.&nbsp;</li><li>Нестандартный подход к работе и жажда нового, например, мы решаем некоторые задачи с помощью AI.</li><li>Техническое комьюнити Ostrovok! Tech проводит митапы, хакатоны, участвует в конференциях и поддерживает даже самые смелые идеи.</li><li>Профессиональное развитие: помогаем сотрудникам выступать на конференциях — от подачи заявки до подготовки презентации.&nbsp;</li><li>Забота о самочувствии команды: с первого месяца работы у наших сотрудников есть ДМС и скидки в сервисе «Ясно».</li><li>Внутренние программы адаптации и обучения, развития soft skills и лидерских навыков, подобранные индивидуально для каждого сотрудника.&nbsp;</li><li>Корпоративные скидки на занятия в Skyeng.</li><li>Корпоративные цены на отели и другие тревел-услуги —&nbsp;чтобы наши сотрудники путешествовали чаще.</li><li>Островок — аккредитованная IT-компания.</li></ul>", "accountDivision": 52696, "division": {"id": 99, "externalId": 52696, "name": "Analytical Development", "foreign": "Analytical Development", "order": 30, "active": true, "parent": 315625, "deep": 1, "meta": null, "teams": [4], "updatedAt": "2026-11-18T04:00:02.904Z", "createdAt": "2026-03-10T15:31:10.928Z"}, "state": "OPEN", "hidden": false, "location": null, "updatedAt": "2026-11-18T04:00:11.041Z", "createdAt": "2026-10-05T15:18:47.875Z", "teamLabel": "Ostrovok!Tech"}, {"id": 3463, "approved": true, "actual": true, "externalId": 4335111, "position": "Senior Pricing Manager", "tasks": "<ul><li>Участвовать в разработке и внедрении стратегий ценообразования для B2C-продукта и каналов компании совместно с руководителем;</li><li>Совместно с продуктовой, маркетинговой и операционной командами формировать ценовые предложения;</li><li>Интегрировать процессы ценообразования в продуктовые и бизнес-процессы компании, выстраивать эффективное взаимодействие со стейкхолдерами;</li><li>Оценивать влияние ценовых решений на ключевые метрики и экономические показатели компании, отвечать за достижение KPI (выручка, маржинальность, конверсия, доля рынка и др.);</li><li>Регулярно анализировать конкурентную среду, рыночные тренды и потребительские инсайты для оперативной корректировки ценовой политики;</li></ul>", "requirements": "<ul><li>Опыт в аналогичной роли от 3-х лет;</li><li>Продвинутые навыки Excel / Google Sheets (сводные таблицы, фильтры, сортировка, построение графиков);</li><li>Опыт работы с SQL: уверенная работа с большими объемами данных, joins, оконные функции;</li><li>Опыт работы с BI-инструментами и визуализацией данных (Tableau, Power BI);</li><li>Сильные знания статистики и анализа данных;</li><li>Умение анализировать и интерпретировать большие объемы данных, превращая их в понятные рекомендации;</li><li>Владение методами конкурентного, рыночного и продуктового анализа;</li><li>Английский язык от уровня В1 и выше.</li></ul>", "conditions": "<ul><li>Полная свобода для достижения результатов: гибкий график, дистанционный или офис — ты сам решаешь, где и когда работать*</li><li>ДМС с первого месяца работы и скидки в сервисе «Ясно», а также дополнительный оплачиваемый выходной день MyTime Day Off.</li><li>Внутренние программы адаптации и обучения, развития soft skills и лидерских навыков.</li><li>Корпоративные скидки на занятия в Skyeng.</li><li>Корпоративные цены на отели и другие услуги для путешествий.</li><li>Аккредитованная IT-компания.</li></ul><p>* <em>Работать у нас можно только из России или Беларуси. Мы оформляем сотрудников в одну из компаний группы, и это зависит от того, где ты работаешь: из России — в российское юрлицо, из Беларуси — в белорусское.</em><br>&nbsp;</p>", "accountDivision": 52703, "division": {"id": 93, "externalId": 52703, "name": "Marketing Department", "foreign": "Marketing Department", "order": 24, "active": true, "parent": null, "deep": 0, "meta": null, "teams": [1], "updatedAt": "2026-11-18T04:00:02.587Z", "createdAt": "2026-03-10T15:31:10.807Z"}, "state": "OPEN", "hidden": false, "location": null, "updatedAt": "2026-11-18T04:00:11.456Z", "createdAt": "2026-09-14T12:00:56.281Z", "teamLabel": "Marketing"}], "query": ""}}, "page": "/vacancy"}</script></body></html>
