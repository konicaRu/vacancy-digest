<script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Fullstack аналитик в команду Gefest","description":"\u003cp>\u003cstrong>О команде\u003c/strong>\u003c/p>\u003cp>\u003cspan>Мы создаём уникальную 2GIS Platform — мощную гео-информационную платформу для бизнеса и государственного сектора, помогаем эффективно решать сложные задачи в навигации, логистике и аналитике. Наши сервисы работают не только в облачной среде (on-Cloud), но и на локальных серверах (on-Premise) на российском и зарубежном рынках. Кроме того, мы разрабатываем единую систему авторизации для всех продуктов платформы. Мы строим продукт, который затрагивает жизни миллионов пользователей и высоко ценится на рынке!\u003c/span>\u003c/p>\u003cp>\u003cspan>У нас собрана сильная кросс-функциональная команда, в которую входят лучшие специалисты по фронтенду, бэкенду, QA, а также опытные продакт-менеджеры и тимлиды (более 20 человек).\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cstrong>Что предстоит делать:\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cspan>работать с командой для сбора и выявления требований, способов их реализации, вариантов скоупа и сроков поставки;\u003c/span>\u003c/li>\u003cli>\u003cspan>ставить задачи разработчикам, отвечать на вопросы, описывать бизнес-процессы, модели данных, архитектуру и всё что посчитаешь необходимым;\u003c/span>\u003c/li>\u003cli>\u003cspan>работать одновременно над несколькими задачами, помогать продактам с проработкой брифов, предлагать улучшения и подсвечивать вопросы и проблемы, в том числе относительно продуктовой, нефункциональной и процессных составляющих.\u003c/span>\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Ждём, что ты:\u003c/strong>\u003c/p>\u003cul>\u003cli>имеешь опыт бизнес/системного анализа от 5 лет;\u003c/li>\u003cli>\u003cspan>проактивен, можешь самостоятельно организовывать свою работу и считаешь, что вопросы, улучшения и обратная связь — часть рутины;\u003c/span>\u003c/li>\u003cli>\u003cspan>обладаешь крепким аналитическим опытом в области разработки и интеграции программного обеспечения и продуктов;\u003c/span>\u003c/li>\u003cli>\u003cspan>пишешь SQL-запросы, знаешь протоколы API, понимаешь, как работают брокеры сообщений, различные БД и что такое SDK;\u003c/span>\u003c/li>\u003cli>\u003cspan>имеешь опыт проектирования архитектуры, хотя бы на уровне большой фичи;\u003c/span>\u003c/li>\u003cli>\u003cspan>знаешь и применяешь стандарты документирования и при этом умеешь их адаптировать;\u003c/span>\u003c/li>\u003cli>\u003cspan>спокойно работаешь одновременно с множеством команд в контекстах разных продуктов.\u003c/span>\u003c/li>\u003c/ul>\u003cp>\u003c/p>\u003ch2>\u003cspan>Почему у нас хорошо\u003c/span>\u003c/h2>\u003cp>\u003cspan>2ГИС — аккредитованная IT-компания. У нас можно работать удаленно из любого города по России. Если хочешь работать в гибридном формате, у нас есть офисы в Москве, Санкт-Петербурге, два классных офиса в Новосибирске. А также коворкинги в ряде городов.\u003c/span>\u003c/p>\u003cp>\u003cspan>Само собой, полностью белая зарплата. Дополнительные дни отпуска за стаж работы в компании. Заботимся о здоровье: ДМС и возможность получать онлайн-консультации и терапевта, невролога, психолога и медицинского агента.\u003c/span>\u003c/p>\u003cp>\u003cspan>А ещё мы проводим внутренние хакатоны, отмечаем значимые релизы. Делимся опытом на митапах и в подкастах, пишем про технологии на Хабре, а про новое в продуктах — на VC и Доставили, рассказываем о внутрянке в телеграм Dev2GIS, выступаем на CodeFest, HighLoad и многое другое.\u003c/span>\u003c/p>","identifier":{"@type":"PropertyValue","name":"2ГИС","value":"415"},"hiringOrganization":{"@type":"Organization","name":"2ГИС"},"url":"/vacancies/analytics/415","jobLocationType":"TELECOMMUTE"}</script>
